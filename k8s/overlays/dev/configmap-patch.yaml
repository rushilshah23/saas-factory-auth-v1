apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  SERVER_BASE_URL: "https://auth-dev.yourdomain.com"
  CLIENT_BASE_URL: "https://dev.yourdomain.com"
  GOOGLE_REDIRECT_URI: "https://auth-dev.yourdomain.com/api/auth/socials/google/callback"
  GITHUB_REDIRECT_URI: "https://auth-dev.yourdomain.com/api/auth/socials/github/callback"
  JWT_ACCESS_TOKEN_EXPIRE_SECONDS: "900"  # 15 minutes for dev
  JWT_REFRESH_TOKEN_EXPIRE_SECONDS: "2592000"  # 30 days for dev