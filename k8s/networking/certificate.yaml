apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-service-certificate
  namespace: auth-service
spec:
  secretName: auth-service-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: auth.yourdomain.com
  dnsNames:
  - auth.yourdomain.com
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048