apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Use your email for Let's Encrypt account registration
    email: your-email@example.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key  # cert-manager will auto-create this secret
    solvers:
      - http01:
          ingress:
            class: nginx
