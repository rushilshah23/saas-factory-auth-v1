apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init
  namespace: auth-ns
spec:
  template:
    metadata:
      labels:
        app: auth-db-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            ['sh', '-c', 'until nc -z postgres-service 5432; do echo "Waiting for Postgres..."; sleep 2; done; echo "Postgres is up!"']

      containers:
        - name: db-init
          image: rushilshah23/auth-api:latest   # same image as your main app
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "python3 init_db.py"]  # 👈 run init script
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_URI
              value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/auth"
            - name: SYNC_DB_URI
              value: "postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/auth"
