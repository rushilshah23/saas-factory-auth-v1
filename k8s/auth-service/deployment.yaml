apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: auth-ns
  labels:
    app: auth-server
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: auth-server
  template:
    metadata:
      labels:
        app: auth-server
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30

      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "Waiting for Postgres..."; sleep 2; done; echo "Postgres is up!"']

      # - name: wait-for-db-init
      #   image: bitnami/kubectl:latest
      #   command:
      #     [
      #       "sh",
      #       "-c",
      #       "echo 'Waiting for auth-db-init job to complete...' && \
      #        until kubectl get job auth-db-init -n auth-ns -o jsonpath='{.status.succeeded}' 2>/dev/null | grep 1; do \
      #          echo 'Waiting for auth-db-init to finish...'; sleep 5; \
      #        done; \
      #        echo 'auth-db-init job completed successfully.'"
      #     ]

      # - name: db-migrate
      #   image: rushilshah23/auth-api:latest
      #   command:
      #     - sh
      #     - -c
      #     - |
      #       echo "Running DB migrations..."
      #       python3 init_db.py
      #   env:
      #     - name: POSTGRES_PASSWORD
      #       valueFrom:
      #         secretKeyRef:
      #           name: auth-secrets
      #           key: POSTGRES_PASSWORD
      #     - name: DB_URI
      #       value: "postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/auth"

      containers:
      - name: auth-server
        image: rushilshah23/auth-api:latest  # Change to your image
        imagePullPolicy: Always

        ports:
        - containerPort: 8000
        env:
        # From ConfigMap
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: ALGORITHM
        - name: EMAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_HOST
        - name: EMAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_PORT
        - name: EMAIL_USER
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_USER
        - name: EMAIL_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_FROM_NAME
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_ALGORITHM
        - name: JWT_ACCESS_TOKEN_EXPIRE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_ACCESS_TOKEN_EXPIRE_SECONDS
        - name: JWT_REFRESH_TOKEN_RENEW_THRESHOLD_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_TOKEN_RENEW_THRESHOLD_SECONDS
        - name: JWT_REFRESH_TOKEN_EXPIRE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_TOKEN_EXPIRE_SECONDS
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: GOOGLE_REDIRECT_URI
        - name: GITHUB_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: GITHUB_REDIRECT_URI
        - name: SERVER_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: SERVER_BASE_URL
        - name: CLIENT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: CLIENT_BASE_URL
        
        # From Secrets
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: SECRET_KEY
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: EMAIL_PASSWORD
        - name: JWT_ACCESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_ACCESS_SECRET_KEY
        - name: JWT_REFRESH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_REFRESH_SECRET_KEY
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GITHUB_CLIENT_SECRET
        
        # Database connection (built from components)

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: POSTGRES_PASSWORD
        - name: DB_URI
          value: "postgresql+asyncpg://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/auth"
        - name: SYNC_DB_URI
          value: "postgresql+psycopg2://postgres:$(POSTGRES_PASSWORD)@postgres-service:5432/auth"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6

        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"