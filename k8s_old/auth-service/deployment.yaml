apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth-service
  labels:
    app: auth-service
    tier: backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        rollmate: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: auth-service
        image: your-registry/auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: SECRET_KEY
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: ALGORITHM
        - name: DB_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: DB_URI
        - name: SYNC_DB_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: SYNC_DB_URI
        - name: EMAIL_HOST
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_HOST
        - name: EMAIL_PORT
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_PORT
        - name: EMAIL_USER
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_USER
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: EMAIL_PASSWORD
        - name: EMAIL_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: EMAIL_FROM_NAME
        - name: SERVER_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: SERVER_BASE_URL
        - name: CLIENT_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: CLIENT_BASE_URL
        - name: JWT_ACCESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_ACCESS_SECRET_KEY
        - name: JWT_REFRESH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_REFRESH_SECRET_KEY
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_ALGORITHM
        - name: JWT_ACCESS_TOKEN_EXPIRE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_ACCESS_TOKEN_EXPIRE_SECONDS
        - name: JWT_REFRESH_TOKEN_RENEW_THRESHOLD_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_TOKEN_RENEW_THRESHOLD_SECONDS
        - name: JWT_REFRESH_TOKEN_EXPIRE_SECONDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_TOKEN_EXPIRE_SECONDS
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: GOOGLE_REDIRECT_URI
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: GITHUB_CLIENT_SECRET
        - name: GITHUB_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: GITHUB_REDIRECT_URI
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30